info:
  name: Register
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "name": "Jane Banda",
        "email": "jane@example.com",
        "password": "TestPassword123!",
        "phone": "+265991234567"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
