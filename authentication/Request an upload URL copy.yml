info:
  name: Request an upload URL copy
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/v1/merchants/documents/upload-url"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "type": "NATIONAL_ID_FRONT",
        "contentType": "image/jpeg"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
